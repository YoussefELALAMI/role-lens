server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same as the Vite dev proxy: the browser only talks to this origin.
    location /api/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 6m;   # CV upload: 5 MB file plus multipart overhead
        proxy_read_timeout 60s;    # synchronous model call on CV upload
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
