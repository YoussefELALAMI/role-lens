spring.application.name=role-lens-api

# 8080 is commonly taken (e.g. EDB's PEMHTTPD service on Windows), so use 8081.
# If you change this, change the proxy target in web/vite.config.ts too.
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/role_lens_db
spring.datasource.username=role_lens_user
spring.datasource.password=role_lens_password


# Flyway owns schema creation and updates, so we don't want Hibernate to manage the schema but we still want it to validate the schema against the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true


# File upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


# Language model (ADR-002). The key comes from the environment, never from this file.
# A missing key doesn't stop the app: the CV is still saved and the profile stays null.
mistral.api-key=${MISTRAL_API_KEY:}
mistral.model=mistral-small-2603
mistral.timeout=30s

management.endpoints.web.exposure.include=health,info