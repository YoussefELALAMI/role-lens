spring.application.name=role-lens-api

spring.datasource.url=jdbc:postgresql://localhost:5433/role_lens_db
spring.datasource.username=role_lens_user
spring.datasource.password=role_lens_password


# Flyway owns schema creation and updates, so we don't want Hibernate to manage the schema but we still want it to validate the schema against the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info